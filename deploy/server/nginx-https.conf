server {
    listen 80;
    listen [::]:80;
    server_name lc.kudesi.com;
    location ^~ /.well-known/acme-challenge/ { root /srv/kudesi-lc/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lc.kudesi.com;
    ssl_certificate /etc/letsencrypt/live/lc.kudesi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lc.kudesi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/kudesi-lc/current/apps/web/dist;
    index index.html;
    client_max_body_size 11m;
    access_log /www/wwwlogs/lc.kudesi.com.access.log;
    error_log /www/wwwlogs/lc.kudesi.com.error.log;
    location ~ /\. { deny all; }
    location /api/ {
        proxy_pass http://127.0.0.1:4107;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
