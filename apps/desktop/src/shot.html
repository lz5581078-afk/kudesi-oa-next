<!DOCTYPE html><html lang="zh-CN"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'"><title>截图标注</title>
<style>[hidden]{display:none!important}body{margin:0;background:#141b22;color:white;font:14px system-ui;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}#tools{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:12px;background:#14262fef;border:1px solid #52717a;border-radius:10px;box-shadow:0 4px 24px #0008;max-width:calc(100vw - 56px);flex-wrap:wrap;justify-content:center;white-space:nowrap}button,input,select{font:inherit;padding:7px;border-radius:5px;border:0}button{cursor:pointer}button.active{background:#168e88;color:#fff}#hint{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#14262fcc;padding:8px 16px;border-radius:6px;pointer-events:none}#error{color:#ffc9c9}</style>
<canvas id="canvas"></canvas><div id="hint">拖动选择截图区域 · Esc 取消</div><div id="tools" hidden><button data-mode="rect">方框</button><button data-mode="arrow">箭头</button><button data-mode="text">文字</button><button data-mode="mosaic">马赛克</button><input id="text" placeholder="标注文字" style="width:100px" aria-label="标注文字"><input id="color" type="color" value="#ff3b40" aria-label="标注颜色"><button id="undo">撤销</button><button id="crop">重选</button><button data-action="copy">复制</button><button data-action="save">保存</button><button id="attach" data-action="attach">附到当前售后</button><button data-action="cancel">取消</button><span id="error"></span></div><script src="shot-editor.cjs"></script></html>
