name: OA desktop installer
on:
  pull_request:
    branches: [integration, main]
    paths: ['apps/desktop/**', 'package-lock.json', '.github/workflows/desktop.yml']
  push:
    branches: [feat/oa-desktop-aftersales]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build -w @kudesi/desktop
      - run: npm run test:native -w @kudesi/desktop
      - run: npm run desktop:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify installation and uninstallation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem 'apps/desktop/release/KudesiOA-Setup-*-x64.exe' | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs/酷得斯OA'
          if (-not (Test-Path (Join-Path $installed '酷得斯OA.exe'))) { throw 'Installed application missing' }
          $uninstaller = Get-ChildItem -LiteralPath $installed -Filter 'Uninstall*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'Uninstaller missing' }
          $p = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstaller failed: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: KudesiOA-Windows-x64
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 30
