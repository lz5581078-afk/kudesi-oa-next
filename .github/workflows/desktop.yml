name: OA desktop installer
on:
  pull_request:
    branches: [integration, main]
    paths: ['apps/desktop/**', 'package-lock.json', '.github/workflows/desktop.yml']
  push:
    branches: [feat/oa-desktop-aftersales]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this verified installer to its existing draft release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build -w @kudesi/desktop
      - run: npm run test:native -w @kudesi/desktop
      - run: npm run desktop:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify installation and uninstallation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path 'apps/desktop/release/XiaobaiOA-Setup-x64.exe').Path
          $installed = Join-Path $env:RUNNER_TEMP 'xiaobai-oa-install'
          $p = Start-Process -FilePath $setup -ArgumentList "/S /D=$installed" -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $installed 'KudesiOA.exe'))) { throw 'Installed application missing' }
          $uninstaller = Get-ChildItem -LiteralPath $installed -Filter 'Uninstall*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'Uninstaller missing' }
          $p = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw "Uninstaller failed: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: XiaobaiOA-Windows-x64
          path: |
            apps/desktop/release/XiaobaiOA-Setup-x64.exe
            apps/desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: XiaobaiOA-Windows-x64
          path: installer
      - name: Publish the tested installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="oa-desktop-v$version"
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          grep -qx "version: $version" installer/latest.yml
          gh release upload "$tag" installer/XiaobaiOA-Setup-x64.exe installer/latest.yml --clobber
          gh release edit "$tag" --draft=false --latest --target "$GITHUB_SHA"
