name: collab-checks
# PR 到 integration 时：类型检查 + 全部测试（含 MySQL 8 数据库测试）；通过后自动合并，失败则在 PR 留言。不部署。
on:
  pull_request:
    branches: [integration]
permissions:
  contents: write
  pull-requests: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ci-only-password
      DB_NAME: kudesi_oa_next
      TEST_DB_NAME: kudesi_oa_test
      RESOURCE_DB_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 启动 MySQL 8（时区 +08:00，和开发环境一致）
        run: |
          docker run -d --name mysql -p 3306:3306 -e MYSQL_ROOT_PASSWORD=ci-only-password mysql:8.0 --default-time-zone=+08:00 --character-set-server=utf8mb4
          # 初始化期间临时服务也会响应 ping；必须等最终 TCP 服务能用指定密码查询。
          ready=false
          for i in $(seq 1 60); do
            if docker exec -e MYSQL_PWD="$DB_PASSWORD" mysql mysql --protocol=TCP -h127.0.0.1 -uroot -N -e "SELECT 1" >/dev/null 2>&1; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then echo "MySQL 未能在 120 秒内就绪"; exit 1; fi
          docker exec -e MYSQL_PWD="$DB_PASSWORD" mysql mysql --protocol=TCP -h127.0.0.1 -uroot -e "create database if not exists kudesi_oa_next character set utf8mb4; create database if not exists kudesi_oa_test character set utf8mb4;"
      - run: npm ci
      - run: npm run typecheck
      - run: RESOURCE_DB_TEST=0 npm test
      # 多个数据库套件共享测试库，串行执行避免范围锁互相死锁。
      - run: npm test -w @kudesi/api -- --runInBand
      - run: python3 -m unittest discover -s deploy/server/tests -v
      - run: npm run build
  windows-agent:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run pack -w @kudesi/agent
      - name: 编译并验证 EXE 安装程序
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = "${env:ProgramFiles(x86)}/NSIS/makensis.exe"
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install nsis --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          $env:MAKENSIS = $compiler
          node apps/agent/scripts/pack-exe.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          $version = (Get-Content apps/agent/package.json -Raw | ConvertFrom-Json).version
          $exe = (Resolve-Path "apps/agent/release/KudesiAssistant-Setup-$version.exe").Path
          $p = Start-Process -FilePath $exe -ArgumentList '/S', '/VALIDATEONLY' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer smoke check failed: $($p.ExitCode)" }
          if (Test-Path 'HKCU:/Software/Microsoft/Windows/CurrentVersion/Uninstall/KudesiAssistant') { throw 'Validation wrote uninstall registration' }
          if (Test-Path "$env:LOCALAPPDATA/KudesiAssistant/agent.json") { throw 'Validation bound a device' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-assistant-installer
          path: apps/agent/release/KudesiAssistant-Setup-*.exe
          if-no-files-found: error
      - name: 解压安装包并检查中文入口
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -LiteralPath apps/agent/release/kudesi-assistant-windows.zip -DestinationPath "$env:RUNNER_TEMP/installer"
          $dir = "$env:RUNNER_TEMP/installer/kudesi-assistant-windows"
          foreach ($file in @('安装助手.cmd', '打开助手.cmd')) {
            if (-not (Test-Path -LiteralPath (Join-Path $dir $file))) { throw '中文安装入口缺失' }
          }
          powershell.exe -NoProfile -STA -File "$dir/setup.ps1" -ValidateOnly
          if ($LASTEXITCODE -ne 0) { throw '解压安装界面初始化失败' }
          powershell.exe -NoProfile -STA -File "$dir/assistant-panel.ps1" -ValidateOnly
          if ($LASTEXITCODE -ne 0) { throw '解压助手面板初始化失败' }
      - name: 校验 Windows 安装脚本与面板
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem apps/agent/windows/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          powershell.exe -NoProfile -STA -File apps/agent/windows/setup.ps1 -ValidateOnly
          if ($LASTEXITCODE -ne 0) { throw '安装界面初始化失败' }
          powershell.exe -NoProfile -STA -File apps/agent/windows/assistant-panel.ps1 -ValidateOnly
          if ($LASTEXITCODE -ne 0) { throw '助手面板初始化失败' }
  merge:
    needs: [check, windows-agent]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: 检查通过，自动合并到 integration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ github.event.pull_request.html_url }}" --merge
  report-failure:
    needs: [check, windows-agent]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: 在 PR 留言
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "${{ github.event.pull_request.html_url }}" --body "自动检查没通过（类型检查、测试或构建失败，或和 integration 有冲突）。请看 Actions 日志修好后再推送；有冲突先把 integration 合进你的分支。"
