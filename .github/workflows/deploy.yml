name: Deploy lc.kudesi.com
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Deploy main, or restore a previously deployed release
        type: choice
        options: [deploy, rollback]
        default: deploy
        required: true
      release_id:
        description: Existing release ID (required only for rollback)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: lc-kudesi-production
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'push' || inputs.action != 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release: ${{ steps.package.outputs.release }}
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ci-only-password
      DB_NAME: kudesi_oa_next
      TEST_DB_NAME: kudesi_oa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start isolated test database
        run: |
          docker run -d --name mysql -p 3306:3306 -e MYSQL_ROOT_PASSWORD="$DB_PASSWORD" mysql:8.0 --default-time-zone=+08:00 --character-set-server=utf8mb4
          ready=false
          for i in $(seq 1 60); do
            if docker exec -e MYSQL_PWD="$DB_PASSWORD" mysql mysql --protocol=TCP -h127.0.0.1 -uroot -N -e 'SELECT 1' >/dev/null 2>&1; then ready=true; break; fi
            sleep 2
          done
          [ "$ready" = true ]
          docker exec -e MYSQL_PWD="$DB_PASSWORD" mysql mysql --protocol=TCP -h127.0.0.1 -uroot -e 'CREATE DATABASE kudesi_oa_next CHARACTER SET utf8mb4; CREATE DATABASE kudesi_oa_test CHARACTER SET utf8mb4;'
      - run: npm ci
      - run: npm run typecheck
      - run: RESOURCE_DB_TEST=0 npm test
      - run: RESOURCE_DB_TEST=1 npm test -w @kudesi/api -- --runInBand
      - name: Verify deployment, rollback and archive safety
        run: python3 -m unittest discover -s deploy/server/tests -v
      - run: npm run build
      - name: Package compiled release
        id: package
        env:
          REVISION: ${{ github.sha }}
        run: |
          release="$(date -u +%Y%m%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${REVISION:0:12}"
          python3 deploy/server/package-release.py "$REVISION" "$release" "$RUNNER_TEMP/artifact/release.tar.gz"
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: lc-release-${{ github.sha }}
          path: ${{ runner.temp }}/artifact/release.tar.gz
          retention-days: 7
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lc-release-${{ github.sha }}
          path: ${{ runner.temp }}/artifact
      - name: Upload, back up, activate and check release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RELEASE: ${{ needs.verify.outputs.release }}
          REVISION: ${{ github.sha }}
        run: bash deploy/server/ci-deploy.sh deploy "$RELEASE" "$RUNNER_TEMP/artifact/release.tar.gz" "$REVISION"
  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore existing release and verify public health
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RELEASE: ${{ inputs.release_id }}
        run: bash deploy/server/ci-deploy.sh rollback "$RELEASE"
